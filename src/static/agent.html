<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>fable-2.0 — direct line</title>
<style>
:root {
  --bg: #0a0a0a; --panel: #0f0f0f; --panel-2: #131313;
  --fg: #e5e5e5; --dim: #8a8a8a; --trace: #5a5a5a; --line: #222;
  --accent: #00ff88; --accent-dim: #00ff8833; --err: #ff5f56;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --track: 0.14em; --fs-label: 0.6875rem; --fs-small: 0.75rem; --pad: 0.75rem;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; background: var(--bg); color: var(--fg);
  font-family: var(--mono); font-size: 0.875rem; line-height: 1.55;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
::selection { background: var(--accent); color: #000; }
:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
.shell {
  max-width: 52rem; margin: 0 auto;
  padding: clamp(1.25rem, 2.5vw, 1.75rem) clamp(0.875rem, 2.5vw, 1.25rem) clamp(3rem, 6vw, 3.75rem);
  min-height: 100dvh; display: flex; flex-direction: column; gap: clamp(1.125rem, 2.5vw, 1.5rem);
}
.masthead .path { color: var(--trace); font-size: var(--fs-small); }
.masthead .path::before { content: "❯ "; color: var(--accent); }
.masthead h1 { font-size: clamp(1.1875rem, 1rem + 1.2vw, 1.5rem); font-weight: 400; margin: 0.5rem 0 0.375rem; letter-spacing: 0.06em; }
.cursor { display: inline-block; width: 0.6em; height: 1.05em; background: var(--accent); vertical-align: text-bottom; margin-left: 0.25rem; animation: blink 1.1s steps(1) infinite; }
.thesis { color: var(--dim); max-width: 68ch; margin: 0; line-height: 1.6; }
.skills-list { margin: 0.5rem 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 0.25rem; }
.skills-list li { color: var(--dim); font-size: var(--fs-small); max-width: 78ch; }
.skills-list .glyph { color: var(--accent); }
.doc-link { font-size: var(--fs-small); }
.demo {
  border: 1px solid var(--line); background: var(--panel); padding: var(--pad);
  font-size: var(--fs-small); color: var(--dim);
}
.demo a { color: var(--accent); }
.chat { border: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: min(33.75rem, 70dvh); }
.chat-head {
  padding: 0.625rem var(--pad); border-bottom: 1px solid var(--line); color: var(--trace);
  font-size: var(--fs-label); letter-spacing: var(--track); text-transform: uppercase;
  display: flex; justify-content: space-between; gap: var(--pad);
}
.chat-head .live { color: var(--accent); white-space: nowrap; text-transform: none; }
.chat-log { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.875rem; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.msg { animation: rise 0.25s ease-out; max-width: 72ch; }
.msg .speaker { font-size: var(--fs-label); letter-spacing: 0.12em; color: var(--trace); margin-bottom: 0.25rem; text-transform: uppercase; }
.msg.user .speaker { color: var(--dim); }
.msg.assistant .speaker { color: var(--accent); }
.msg .text { white-space: pre-wrap; word-wrap: break-word; }
.msg.user .text { color: var(--dim); }
.msg.assistant.error .text { color: var(--err); }
.starters { padding: 0 1rem 0.75rem; display: flex; flex-wrap: wrap; gap: 0.5rem; }
.starters button {
  font-family: var(--mono); font-size: var(--fs-small); color: var(--dim); background: transparent;
  border: 1px solid var(--line); padding: 0.375rem 0.625rem; cursor: pointer; text-align: left;
  transition: color 0.15s ease, border-color 0.15s ease;
}
.starters button:hover { color: var(--accent); border-color: var(--accent-dim); }
.composer { display: flex; border-top: 1px solid var(--line); }
.composer .prompt-glyph { padding: 0.75rem 0 0.75rem 0.875rem; color: var(--accent); }
.composer input {
  flex: 1; font-family: var(--mono); font-size: 0.875rem; color: var(--fg); background: transparent;
  border: 0; outline: none; padding: 0.75rem; min-width: 0;
}
.composer input::placeholder { color: var(--trace); }
.composer button {
  font-family: var(--mono); font-size: var(--fs-small); color: var(--accent); background: transparent;
  border: 0; border-left: 1px solid var(--line); padding: 0 1rem; cursor: pointer;
}
.composer button:disabled { color: var(--trace); cursor: default; }
.statusline { padding: 0.375rem var(--pad); border-top: 1px solid var(--line); color: var(--trace); font-size: var(--fs-label); display: flex; justify-content: space-between; gap: var(--pad); }
.statusline .err { color: var(--err); }
footer { color: var(--trace); font-size: var(--fs-small); border-top: 1px dashed var(--line); padding-top: 0.875rem; }
@keyframes blink { 50% { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(0.25rem); } }
@media (prefers-reduced-motion: reduce) {
  .cursor { animation: none; }
  .msg { animation: none; }
  .starters button { transition: none; }
}
</style>
</head>
<body>
<div class="shell">
  <header class="masthead">
    <div class="path">/agent</div>
    <h1 id="agent-name">loading<span class="cursor"></span></h1>
    <p class="thesis" id="agent-desc"></p>
    <ul class="skills-list" id="agent-skills"></ul>
    <p class="doc-link" id="agent-doc"></p>
  </header>

  <div class="demo" id="demo-block" hidden>
    LIVE DEMO — <a id="demo-link" href="#" target="_blank" rel="noreferrer">this project's own frontend</a>
  </div>

  <div class="chat">
    <div class="chat-head">
      <span>DIRECT LINE — FABLE-2.0-AGENT</span>
      <span class="live" id="chat-live">● connecting</span>
    </div>
    <div class="chat-log" id="chat-log" role="log" aria-label="conversation with fable-2.0 agent"></div>
    <div class="starters" id="starters"></div>
    <form class="composer" id="composer">
      <span class="prompt-glyph" aria-hidden="true">❯</span>
      <input id="composer-input" placeholder="ask fable-2.0 directly" aria-label="message fable-2.0 agent" autocomplete="off" />
      <button type="submit" id="send-btn" disabled>SEND</button>
    </form>
    <div class="statusline">
      <span id="status-context">no context yet</span>
      <span id="status-state">ready</span>
    </div>
  </div>

  <footer>fable-2.0 — served in-process by its own engine. Card: <a href="/.well-known/agent-card.json">/.well-known/agent-card.json</a></footer>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var logEl = $("chat-log"), input = $("composer-input"), sendBtn = $("send-btn"),
      form = $("composer"), starters = $("starters"), liveEl = $("chat-live"),
      ctxEl = $("status-context"), stateEl = $("status-state");

  var contextId = null, busy = false, card = null, lastError = null;

  function addMsg(role, text, isError) {
    var wrap = document.createElement("div");
    wrap.className = "msg " + (role === "user" ? "user" : "assistant") + (isError ? " error" : "");
    var speaker = document.createElement("div");
    speaker.className = "speaker";
    speaker.textContent = role === "user" ? "you" : "fable-2.0";
    var text_ = document.createElement("div");
    text_.className = "text";
    text_.textContent = text;
    wrap.appendChild(speaker);
    wrap.appendChild(text_);
    logEl.appendChild(wrap);
    logEl.scrollTop = logEl.scrollHeight;
    return wrap;
  }

  function setBusy(v) {
    busy = v;
    input.disabled = v;
    sendBtn.disabled = v || input.value.trim().length === 0;
    liveEl.textContent = v ? "● working" : (lastError ? "● error" : "● live");
    if (!lastError) {
      stateEl.className = "";
      stateEl.textContent = v ? "waiting" : "ready";
    }
  }

  function setError(msg) {
    lastError = msg;
    stateEl.className = "err";
    stateEl.textContent = msg.slice(0, 120);
  }

  function clearError() {
    lastError = null;
    stateEl.className = "";
    stateEl.textContent = busy ? "waiting" : "ready";
  }

  async function send(text) {
    if (!text || busy) return;
    if (starters) { starters.hidden = true; }
    addMsg("user", text);
    input.value = "";
    setBusy(true);
    clearError();
    try {
      var message = { messageId: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())), role: "ROLE_USER", parts: [{ text: text }] };
      if (contextId) message.contextId = contextId;
      var res = await fetch("/a2a", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: "SendMessage", params: { message: message } }),
      });
      var body = await res.json();
      if (body.error) throw new Error(body.error.message || "agent error");
      var reply = body.result && body.result.message;
      if (!reply) throw new Error("malformed reply");
      contextId = reply.contextId || contextId;
      ctxEl.textContent = contextId ? "a2a context " + contextId.slice(0, 8) : "no context yet";
      var replyText = (reply.parts || []).map(function (p) { return p.text || ""; }).join("\n").trim();
      addMsg("assistant", replyText || "(empty reply)");
    } catch (err) {
      addMsg("assistant", "Couldn't reach the agent: " + err.message, true);
      setError(err.message);
    } finally {
      setBusy(false);
    }
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    send(input.value.trim());
  });
  input.addEventListener("input", function () {
    sendBtn.disabled = busy || input.value.trim().length === 0;
  });

  async function loadCard() {
    try {
      var res = await fetch("/.well-known/agent-card.json");
      card = await res.json();
      $("agent-name").textContent = card.name || "fable-2.0";
      $("agent-desc").textContent = card.description || "";
      var docUrl = card.documentationUrl;
      if (docUrl) {
        var a = document.createElement("a");
        a.href = docUrl;
        a.textContent = docUrl.replace("https://", "");
        $("agent-doc").appendChild(a);
      }
      var skillsEl = $("agent-skills");
      (card.skills || []).forEach(function (s) {
        var li = document.createElement("li");
        var glyph = document.createElement("span");
        glyph.className = "glyph";
        glyph.textContent = "[" + s.id + "] ";
        li.appendChild(glyph);
        li.appendChild(document.createTextNode(s.description || s.name || ""));
        skillsEl.appendChild(li);
      });
      var examples = [];
      (card.skills || []).forEach(function (s) { (s.examples || []).forEach(function (ex) { examples.push(ex); }); });
      examples.slice(0, 6).forEach(function (ex) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = "❯ " + ex;
        btn.addEventListener("click", function () { send(ex); });
        starters.appendChild(btn);
      });
      var extensions = (card.capabilities && card.capabilities.extensions) || [];
      var demo = extensions.find(function (e) { return e.uri === "urn:x-portfolio:live-demo"; });
      if (demo && demo.params && demo.params.url) {
        $("demo-block").hidden = false;
        $("demo-link").href = demo.params.url;
        $("demo-link").textContent = demo.params.url.replace(/^https?:\/\//, "");
      }
      addMsg("assistant", "You're talking to me now — " + (card.name || "fable-2.0") + "'s own agent. Ask me anything about this project.");
      setBusy(false);
    } catch (err) {
      $("agent-name").textContent = "fable-2.0";
      $("agent-desc").textContent = "Couldn't load the agent card.";
      liveEl.textContent = "● offline";
      setError(err.message);
    }
  }

  loadCard();
})();
</script>
</body>
</html>
